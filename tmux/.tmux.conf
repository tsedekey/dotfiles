##### Prefix: Ctrl-a instead of Ctrl-b
set -g prefix C-a
unbind C-b
bind C-a send-prefix

##### Better terminal support
set -g mouse on
set -g focus-events on
set -g allow-passthrough on
set -g history-limit 100000
set -g default-terminal "xterm-256color"
set -sa terminal-overrides ",xterm-256color:RGB"

##### Status bar: Catppuccin Mocha, background follows Ghostty (bg=default, so its colour/opacity/blur show through)
set -g status-position bottom
set -g status-style "bg=default,fg=#cdd6f4"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#f9e2af"
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

# Left side
set -g status-left-length 40
set -g status-left "#[fg=#89b4fa,bg=default,bold] #S "

# Windows
set -g window-status-format "#[fg=#a6adc8,bg=default] #I:#W "
set -g window-status-current-format "#[fg=#11111b,bg=#89b4fa,bold] #I:#W "
set -g window-status-separator ""

# Right side
set -g status-right-length 80
set -g status-right "#[fg=#a6adc8,bg=default] %H:%M #[fg=#9399b2,bg=default] %d-%b-%y "

# macOS clipboard integration (native support in modern terminals like Ghosty)
set-option -g set-clipboard on

##### Popups (prefix + a / prefix + W)
# a: fuzzy-find agent artifacts (md/html) and open in Plannotator; ctrl-o = browser
bind a display-popup -E -w 90% -h 80% -T " artifacts " "$HOME/dotfiles/tmux/popups/artifact-picker.sh"
# W: workmux dashboard (all agents, all sessions). C-s/C-w are taken by tmux-resurrect
bind W display-popup -E -w 95% -h 90% -T " workmux " "workmux dashboard"
# N: workflow launcher. Pick change / epic / review / investigate / assess / medic / release /
# daily / general; Enter launches with the defaults from workmux/workflows.yaml (some workflows first
# ask for a case: PR number, CVE id, date...), Tab edits agent, skill, repo, worktree, model, window,
# files folder and case first, and Tab inside a path field lists the folder to pick from. Creates the
# session (first word) when it is missing. The skill is started as the agent's first prompt.
bind N display-popup -E -w 90% -h 60% -T " launch " "$HOME/dotfiles/tmux/popups/launcher.py"
# F: finish this window. Plain window -> close it. Worktree window -> if merged (PR merged or already
# in origin's base) and clean: workmux remove (worktree + branch + window); otherwise only close the
# window and keep the worktree. Always shows what it will do and asks first; refuses the last window
# of a session. (tmux does not expand #{...} in a popup command, so the script finds its window itself.)
bind F display-popup -E -w 70% -h 60% -T " finish window " "$HOME/dotfiles/tmux/popups/finish-window.py"

##### workmux sidebar: on for every window until you toggle it off
# Global scope, so new sessions and windows (the launcher's included) get a sidebar via workmux's
# own tmux hooks. The on/off state lives in the tmux server and a restart loses it, so this line
# turns it back on at server start (idempotent). B toggles it off/on everywhere.
run-shell -b "workmux sidebar on"
bind B run-shell "workmux sidebar"

##### TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

##### Resurrect / Continuum
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

##### Keep continuum last if possible
run '~/.tmux/plugins/tpm/tpm'

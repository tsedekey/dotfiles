##### Prefix: Ctrl-a instead of Ctrl-b
set -g prefix C-a
unbind C-b
bind C-a send-prefix

##### Better terminal support
set -g mouse on
set -g history-limit 100000
set -g default-terminal "screen-256color"
set -sa terminal-overrides ",xterm-256color:RGB"
set -g extended-keys on

##### Status bar: softer Catppuccin-like colors
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#f9e2af"
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

# Left side
set -g status-left-length 40
set -g status-left "#[fg=#89b4fa,bg=#1e1e2e,bold] #S "

# Windows
set -g window-status-format "#[fg=#a6adc8,bg=#1e1e2e] #I:#W "
set -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W "
set -g window-status-separator ""

# Right side
set -g status-right-length 80
set -g status-right "#[fg=#a6adc8,bg=#1e1e2e] %H:%M #[fg=#9399b2,bg=#1e1e2e] %d-%b-%y "

# macOS clipboard integration
set-option -g set-clipboard on
if-shell "uname | grep -q Darwin" {
  set-option -g default-command "reattach-to-user-namespace -l zsh"
  bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
  bind-key -T copy-mode Enter send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
}

##### TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

##### Resurrect / Continuum
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

##### Keep continuum last if possible
run '~/.tmux/plugins/tpm/tpm'

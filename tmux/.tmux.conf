##### Prefix: Ctrl-a instead of Ctrl-b
set -g prefix C-a
unbind C-b
bind C-a send-prefix

##### Better terminal support
set -g mouse on
set -g focus-events on
set -g allow-passthrough on
set -g history-limit 100000
set -g default-terminal "xterm-256color"
set -sa terminal-overrides ",xterm-256color:RGB"

##### Status bar: softer Catppuccin-like colors
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#f9e2af"
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

# Left side
set -g status-left-length 40
set -g status-left "#[fg=#89b4fa,bg=#1e1e2e,bold] #S "

# Windows
set -g window-status-format "#[fg=#a6adc8,bg=#1e1e2e] #I:#W "
set -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W "
set -g window-status-separator ""

# Right side
set -g status-right-length 80
set -g status-right "#[fg=#a6adc8,bg=#1e1e2e] %H:%M #[fg=#9399b2,bg=#1e1e2e] %d-%b-%y "

# macOS clipboard integration (native support in modern terminals like Ghosty)
set-option -g set-clipboard on

##### Popups (prefix + a / prefix + W)
# a: fuzzy-find agent artifacts (md/html) and open in Plannotator; ctrl-o = browser
bind a display-popup -E -w 90% -h 80% -T " artifacts " "$HOME/dotfiles/tmux/popups/artifact-picker.sh"
# W: workmux dashboard (all agents, all sessions). C-s/C-w are taken by tmux-resurrect
bind W display-popup -E -w 95% -h 90% -T " workmux " "workmux dashboard"
# N: workflow launcher. Pick change plan / change run / review / investigate / assess / medic /
# release / daily; Enter launches with the defaults from workmux/workflows.yaml, Tab edits agent,
# model, window name and directory first. Creates the session (first word) when it is missing.
bind N display-popup -E -w 90% -h 60% -T " launch " "$HOME/dotfiles/tmux/popups/launcher.py"

##### TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

##### Resurrect / Continuum
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

##### Keep continuum last if possible
run '~/.tmux/plugins/tpm/tpm'

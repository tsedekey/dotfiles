# Defaults for the workflow launcher (tmux/popups/launcher.py, tmux prefix + N).
#
# One entry per workflow. The key is what you pick in the popup; the FIRST WORD is the tmux
# session unless `session:` is set. Pressing Enter on a workflow launches with exactly these values
# (plus whatever the workflow `ask:`s for); Tab lets you edit every field first. Typing filters by
# workflow name only; on a tie the FIRST listed wins. Keep the workflow you launch most often above
# its siblings.
#
# A workflow is: an agent, a skill, and the places it works in.
#
#   agent   a name from `agents:` in ~/.config/workmux/config.yaml (env, args and command come from
#           there, so profiles never drift). Typos are a load error, not a runtime surprise.
#   model   passed as `--model <model>`; empty = the harness' own default. workmux add has no model
#           flag, so with a worktree the default is ignored (with a note) and an explicit --model errors.
#   skill   started as the agent's first prompt: `/<skill> <case>`. Must be installed for that agent
#           (Claude: ~/.claude/skills, Copilot: ~/.copilot/skills), otherwise it is a load error.
#           Empty = no first prompt.
#   repo    the git repo the agent works in. It starts there, and a worktree (below) branches off it.
#           Empty = no repo: the agent starts in the case folder.
#   files   the folder that holds this workflow's cases, e.g. .../review-companion/cases. Must
#           exist (a typo should fail, not create a stray tree). The right-hand shell pane opens in
#           <files>/<case>, and the agent starts there when there is no repo.
#   case    default case name: one folder under `files` (PR number, issue-slug, a date...). `{date}` =
#           today; `{latest:N}` = the newest YYYY-MM-DD folder less than N days old (a shift or duty that
#           is still running: resume it), otherwise today (start a new one). The launcher creates the
#           folder; the skill finds it and resumes from its checkpoint.
#           Empty = no default; with `ask: [case]` the Enter flow asks for it (Tab lists existing cases).
#   case_label  what the prompt calls the case ("PR number").
#   case_arg  false = start the skill WITHOUT the case (`/<skill>`), for a skill that takes no argument.
#           Default true: `/<skill> <case>`. The case still names the folder and the window.
#   reuse   true = launching again, when the window `<window>` is already open in the session, switches to
#           it and starts nothing (no second agent, no new folder). Default false: every launch opens a
#           new window. Plain windows only; a worktree already has `workmux add`'s own handling.
#   workspaces  instead of `files`/`repo`, for a workflow that works on one epic at a time: a folder holding one
#           sub-folder per epic. The launcher asks WHICH epic (offering the one launched last, remembered in
#           <workspaces>/.last; Tab lists the others), the right-hand pane opens in that epic's folder, and the
#           case (a task issue of the epic) gets no folder of its own. <epic>/epic.yaml holds two optional
#           settings, asked once for a new epic: `repo:` the epic's docs checkout (the agent works there) and
#           `issues:` owner/repo, where a bare task number lives. The skill is started as
#           `/<skill> <task> epic=<epic folder name>`. CLI: --files <epic folder> names the epic.
#   key     the case is ONE typed value, the case KEY, and it is all of these at once: the case folder
#           (<files>/<key>), the window name (<workflow>-<key>) and the skill's argument (/<skill> <key>).
#           The skill looks up everything else (title, Slack channel, Jira, linked PRs) from the key and
#           records it in the case checkpoint. The launcher turns what you typed or pasted into the one
#           canonical spelling and refuses anything else. Kinds:
#             github-issue:<owner>/<repo>   65755 | #65755 | repo#65755 | the issue URL. The workflow's
#             github-pr:<owner>/<repo>      default repo is the bare number (folder 65755); any other repo is
#                                           repo-65755 (folder dmn-scala-391).
#             incident                      INC-8745 | the incident.io URL. A SUPPORT-nnnnn Jira key is refused.
#             cve                           CVE-2026-47848 (any case)
#           A workflow with a `key` has no default `case`. Workflows without one (medic, release, daily,
#           general) take the `case` text as typed.
#   ask     fields the plain Enter flow asks for: case, repo. (The Tab flow always asks for everything.)
#   worktree  false (default)  a plain tmux window; the agent is typed into its shell. No git needed.
#             true             first creates a worktree: `workmux add <branch> -a <agent> --parent-session
#                              <session>`, run from `repo`. Asks for the branch. The Tab flow can switch it
#                              on or off for a single launch whenever a repo is set. workmux opens its own
#                              shell pane in the worktree; the launcher moves it to the case folder.
#   extra_dirs  more folders the agent may use (--add-dir), e.g. the code checkout for a workflow that
#               starts in its case folder. Not passed for worktrees (workmux builds that command).
#   session   tmux session; default = the first word of the workflow name.
#   window    window name; empty = "<last word of the workflow>-<case>", or -<HHMM> without a case.
#   hidden    true = not in the popup; only reachable by name from the CLI (another agent starts it:
#             launcher.py dagrunner --branch X --prompt "/dagrunner-companion <plan>").
#
# Monitoring needs nothing here: every window is tracked by the agents' workmux hooks.
# `general` runs the PERSONAL Claude profile (~/.claude-personal); its settings.json carries the same
# workmux hooks as the work profile (added 2026-11-09), so those windows are tracked too.
#
# Names below are TODAY's skill and folder names. Each workflow is renamed on its own turn (skill, folder,
# the skill's hardcoded paths, pointers in CLAUDE.md): see the realignment notes. medic, release and
# general had no folder yet, so they already use their final ones.
# Values marked (guess) were seeded without checking with Eddie; edit freely.

workflows:
  change:                              # plan stage: Copilot in the main checkout, no worktree
    agent: copilot
    model: claude-sonnet-5.5
    skill: change-companion
    repo: ~/dev/camunda/camunda        # worktree off it is optional (Tab flow)
    files: ~/.local/share/camunda/change-companion    # <issue number>/
    key: github-issue:camunda/camunda
    case_label: GitHub issue
    ask: [case]

  dagrunner:                           # the run stage; started BY the change session on the DagRunner path
    hidden: true
    session: change                    # same session and sidebar group as the plan that started it
    worktree: true
    agent: claude-driver
    skill: dagrunner-companion
    repo: ~/dev/camunda/camunda
    files: ~/.local/share/camunda/dagrunner

  epic:                                # Claude, not Copilot: epic-companion needs Slack and Glean
    agent: claude
    model: claude-sonnet-5-5           # Claude ids are hyphenated (Copilot's are claude-sonnet-5.5)
    skill: epic-companion
    workspaces: ~/.local/share/camunda/epic-companion    # one folder per epic, e.g. product-hub-3517-variable-trace/
    key: github-issue                  # the TASK issue; its default repo is the epic's `issues:` in <epic>/epic.yaml
    case_label: task issue
    ask: [epic, case]                  # which epic (offers the one launched last), then the task

  review:                              # reads the PR; no code to change, so it starts in its case folder
    agent: copilot
    model: claude-sonnet-5.5
    skill: review-companion
    files: ~/.local/share/camunda/review-companion/cases    # <PR number>/ (other repos: dmn-scala-391/)
    key: github-pr:camunda/camunda
    case_label: PR number
    ask: [case]
    extra_dirs: [~/dev/camunda/camunda]

  investigate:
    agent: claude
    skill: investigate-companion
    files: ~/.local/share/camunda/investigate-companion/cases    # <INC-nnnn>/
    key: incident
    case_label: incident.io ref
    ask: [case]
    extra_dirs: [~/dev/camunda/camunda]

  assess:
    agent: claude
    skill: assess-companion
    files: ~/.local/share/camunda/assess-companion/cases    # <CVE-ID>/
    key: cve
    case_label: CVE ID
    ask: [case]

  medic:                               # one folder per shift, named by its start date
    agent: claude
    skill: medic-companion
    files: ~/.local/share/camunda/medic-companion
    case: "{latest:7}"                 # resume the shift started in the last 7 days, else today; Tab lists shifts
    case_label: shift start date
    ask: [case]

  release:                             # one folder per release duty (about 4 weeks), named by its start date
    agent: claude
    skill: release-companion
    files: ~/.local/share/camunda/release-companion
    case: "{latest:28}"                # resume the duty started in the last 28 days, else today; Tab lists duties
    case_label: duty start date
    ask: [case]
    extra_dirs: [~/dev/camunda/camunda]    # (guess) the skill's steps run git in the code checkout

  daily:                               # one window and one folder per day: launching again goes back to it
    agent: claude
    skill: daily-companion
    files: ~/.local/share/camunda/daily-companion/daily    # <date>/ (the report, run log and DX data stay in daily-companion/)
    case: "{date}"
    case_arg: false                    # the skill takes no argument: the date is only the folder and window name
    reuse: true

  general:                             # Claude on the personal profile. Not for work code.
    agent: claude-personal             # CLAUDE_CONFIG_DIR=~/.claude-personal, not ~/.claude
    files: ~/.local/share/general      # <session name>/ ; outside ~/.local/share/camunda: personal, not work
    case_label: session name
    ask: [case]

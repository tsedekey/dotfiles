# Defaults for the workflow launcher (tmux/popups/launcher.py, tmux prefix + N).
#
# One entry per workflow. The key is what you pick in the popup; the FIRST WORD is the tmux
# session ("change plan" and "change run" both live in session `change`) unless `session:` is set.
# Pressing Enter on a workflow launches with exactly these values; Tab lets you edit them first.
# Typing filters by workflow name only; on a tie the FIRST listed wins, so "change" + Enter
# picks `change plan`. Keep the workflow you launch most often above its siblings.
#
#   worktree  false (default)  a plain tmux window in `dir`; the agent is typed into its shell. No git
#                              repo needed, so workspaces under ~/.local/share/camunda work. Plans,
#                              reviews, investigations, assessments, medic, release and daily start
#                              here: read-only work can fetch a branch without a worktree.
#             true             first creates a worktree: `workmux add <branch> -a <agent>
#                              --parent-session <session>`, run from `dir` (a git repo). Asks for the
#                              branch. Only for work that changes code (change run). The Tab flow in
#                              the popup can switch it on or off for a single launch.
#   agent   a name from `agents:` in ~/.config/workmux/config.yaml (env, args and command come from
#           there, so profiles never drift). Typos are a load error, not a runtime surprise.
#   model   passed as `--model <model>`; empty = the harness' own default. workmux add has no model
#           flag, so with a worktree the default is ignored (with a note) and an explicit --model errors.
#   dir     working directory of the agent (~ expanded). Must exist.
#   window  window name; empty = "<last word of the workflow>-<HHMM>", e.g. plan-0712.
#
# Monitoring needs nothing here: every window is tracked by the agents' workmux hooks.
# `general` runs the PERSONAL Claude profile (~/.claude-personal); its settings.json carries the same
# workmux hooks as the work profile (added 2026-11-09), so those windows are tracked too.
# Values marked (guess) were seeded without checking with Eddie; edit freely.

workflows:
  change plan:
    agent: copilot
    model: claude-sonnet-5.5
    dir: ~/dev/camunda/camunda        # main checkout, no worktree (plan stage)

  change run:
    worktree: true                    # the only workflow that changes code, so the only worktree
    agent: claude-driver
    dir: ~/dev/camunda/camunda        # repo `workmux add` runs from; asks for the branch

  epic:                                # agent + model: Eddie; dir: where define-companion keeps epics
    agent: claude                      # discovery, define, task breakdown: thinking work, no worktree
    model: claude-sonnet-5-5           # Claude ids are hyphenated (Copilot's are claude-sonnet-5.5)
    dir: ~/.local/share/camunda/feature-work-companion/epics   # epics/<epic-slug>/ per epic

  review:                              # (guess) agent, model
    agent: copilot
    model: claude-sonnet-5.5
    dir: ~/dev/camunda/camunda

  investigate:                         # (guess) agent, dir
    agent: claude
    dir: ~/dev/camunda/camunda

  assess:                              # (guess) agent, dir
    agent: claude
    dir: ~/.local/share/camunda/cve-companion

  medic:                               # (guess) agent, dir
    agent: claude
    dir: ~/dev/camunda/camunda

  release:                             # (guess) agent, dir
    agent: claude
    dir: ~/dev/camunda/camunda

  daily:                               # (guess) agent
    agent: claude
    dir: ~/.local/share/camunda/daily

  general:                             # agent: Eddie (Claude on the personal profile); dir: (guess)
    agent: claude-personal             # CLAUDE_CONFIG_DIR=~/.claude-personal, not ~/.claude. Not for work code.
    dir: "~"                           # general purpose, not tied to a repo (quoted: a bare ~ is YAML null)
